name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build, format check and tests
        run: ./mvnw -B verify
      - name: Test results summary
        if: always()
        run: |
          {
            echo "## Unit and integration test results"
            echo ""
            echo "| Suite | Tests | Failures | Errors | Skipped |"
            echo "|---|---|---|---|---|"
            for f in target/surefire-reports/TEST-*.xml; do
              [ -e "$f" ] || continue
              head -c 2000 "$f" | grep -o '<testsuite [^>]*' | head -1 | awk -v RS=' ' '
                /^name=/ {sub(/name="/,""); sub(/"$/,""); n=$0}
                /^tests=/ {sub(/tests="/,""); sub(/"$/,""); t=$0}
                /^failures=/ {sub(/failures="/,""); sub(/"$/,""); fa=$0}
                /^errors=/ {sub(/errors="/,""); sub(/"$/,""); e=$0}
                /^skipped=/ {sub(/skipped="/,""); sub(/"$/,""); s=$0}
                END {printf "| %s | %s | %s | %s | %s |\n", n, t, fa, e, s}'
            done
          } | tee test-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post test results to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file test-summary.md --edit-last --create-if-none
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
